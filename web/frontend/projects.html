<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目列表 — scan-job</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-xl">
    <a class="navbar-brand text-white" href="/dashboard">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      scan-job
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/dashboard">仪表盘</a>
      <a class="nav-link active" href="/projects">项目列表</a>
      <a class="nav-link" href="/scan">扫描管理</a>
      <a class="nav-link" href="/settings">设置</a>
    </div>
  </div>
</nav>

<div class="container-xl py-4" v-scope="ProjectsApp()" @vue:mounted="load()">

  <!-- 工具栏 -->
  <div class="card mb-3">
    <div class="card-body py-2">
      <div class="row g-2 align-items-center">
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="搜索项目或代币符号..."
                 v-model="search" @input="debounceLoad()">
        </div>
        <div class="col-md-2">
          <select class="form-select" v-model="filterMode" @change="load()">
            <option value="all">全部代币/项目</option>
            <option value="unlisted">💎 仅未上大所 (Gems)</option>
            <option value="upbit_candidate">🔥 Upbit 候选标的</option>
          </select>
        </div>
        <div class="col-md-2">
          <select class="form-select" v-model="source" @change="load()">
            <option value="">全部数据源</option>
            <option value="cryptorank">CryptoRank</option>
            <option value="rootdata">RootData</option>
          </select>
        </div>
        <div class="col-md-2 text-end">
          <span class="text-muted">共 {{ total }} 条</span>
        </div>
        <div class="col-md-3 text-end">
          <button class="btn btn-sm btn-primary me-1" @click="exportCSV()">📥 导出</button>
          <button class="btn btn-sm btn-danger" @click="clearAll()" :disabled="!total">
            🗑️ 清空全部
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 表格 -->
  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>#</th>
            <th>项目</th>
            <th>代币</th>
            <th>Upbit 资方拟合度</th>
            <th>命中偏好资方</th>
            <th>融资总额</th>
            <th>最新轮次</th>
            <th>投资方</th>
            <th>上所状态</th>
            <th style="width:60px">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="(p, i) in projects" :key="p.id">
            <td>{{ offset + i + 1 }}</td>
            <td>
              <img v-if="p.logo" :src="p.logo" class="project-logo" onerror="this.style.display='none'">
              {{ p.project_name }}
            </td>
            <td>
              <strong class="text-primary">{{ p.token_symbol || '-' }}</strong>
            </td>
            <td v-html="fmtUpbitFit(p.upbit_fit_score, p.upbit_listed)"></td>
            <td v-html="fmtBackers(p.matched_upbit_backers)"></td>
            <td v-html="fmtMoney(p.total_funding)"></td>
            <td>{{ p.latest_round || '-' }}</td>
            <td>{{ fmtInvestors(p.investors) }}</td>
            <td>
              <span v-if="p.upbit_listed" class="badge bg-success">Upbit已上线</span>
              <span v-else-if="p.unlisted_gem_flag" class="badge bg-danger">未上所 (Gem)</span>
              <span v-else-if="p.cmc_listed" class="badge bg-info">CMC已收录</span>
              <span v-else class="badge bg-secondary">其他</span>
            </td>
            <td>
              <button class="btn btn-sm btn-ghost-danger p-0" title="删除" @click="deleteItem(p.id)">
                🗑️
              </button>
            </td>
          </tr>
          <tr v-if="!projects.length">
            <td colspan="10" class="p-4 text-center text-muted">暂无数据</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 分页 -->
    <div class="card-footer d-flex justify-content-between align-items-center py-2" v-if="totalPages > 1">
      <span class="text-muted">第 {{ page }} / {{ totalPages }} 页</span>
      <div class="btn-group">
        <button class="btn btn-sm btn-outline-secondary" :disabled="page <= 1" @click="goPage(page - 1)">上一页</button>
        <button class="btn btn-sm btn-outline-secondary" :disabled="page >= totalPages" @click="goPage(page + 1)">下一页</button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/petite-vue@0.4.1/dist/petite-vue.iife.js"></script>
<script src="/static/app.js"></script>
<script>
function ProjectsApp() {
  let timer = null;
  return {
    projects: [],
    total: 0,
    page: 1,
    limit: 30,
    search: '',
    source: '',
    filterMode: 'all',
    get offset() { return (this.page - 1) * this.limit; },
    get totalPages() { return Math.max(1, Math.ceil(this.total / this.limit)); },

    async load() {
      try {
        let url = `/api/projects?page=${this.page}&limit=${this.limit}`;
        if (this.source) url += `&source=${encodeURIComponent(this.source)}`;
        if (this.search) url += `&search=${encodeURIComponent(this.search)}`;
        if (this.filterMode === 'unlisted') url += `&unlisted_only=true`;
        if (this.filterMode === 'upbit_candidate') url += `&upbit_candidate_only=true`;

        const res = await API.get(url);
        this.projects = res.data || [];
        this.total = res.total || 0;
      } catch (e) {
        console.error(e);
      }
    },
    debounceLoad() {
      clearTimeout(timer);
      timer = setTimeout(() => { this.page = 1; this.load(); }, 300);
    },
    goPage(p) {
      this.page = p;
      this.load();
    },
    async deleteItem(id) {
      if (!confirm('确定删除该项目？')) return;
      try {
        await API.delete(`/api/projects/${id}`);
        Toast.show('已删除', 'success');
        this.load();
      } catch (e) {
        Toast.show('删除失败: ' + e.message, 'danger');
      }
    },
    async clearAll() {
      if (!confirm('警告：确定清空所有数据？')) return;
      try {
        await API.delete('/api/projects/all');
        Toast.show('已清空', 'success');
        this.page = 1;
        this.load();
      } catch (e) {
        Toast.show('清空失败: ' + e.message, 'danger');
      }
    },
    exportCSV() {
      if (!this.projects.length) return;
      const headers = ['项目名', '代币', 'Upbit拟合度', '融资总额', '最新轮次', '投资方'];
      const rows = this.projects.map(p => [
        p.project_name, p.token_symbol || '', p.upbit_fit_score || 0,
        p.total_funding || '', p.latest_round || '', p.investors || ''
      ]);
      let csv = '\uFEFF' + headers.join(',') + '\n';
      rows.forEach(r => { csv += r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',') + '\n'; });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `scan_projects_${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
    },
    fmtMoney: (n) => fmt.money(n),
    fmtUpbitFit: (score, isListed) => fmt.upbitFitBadge(score, isListed),
    fmtBackers: (b) => fmt.backersBadges(b),
    fmtInvestors: (s) => fmt.investors(s),
  };
}

PetiteVue.createApp().mount();
</script>
</body>
</html>
